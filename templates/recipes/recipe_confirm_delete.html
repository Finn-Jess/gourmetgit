{% extends 'base.html' %}
{% block title %}Delete Recipe{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4">
            <h3 class="text-danger fw-bold mb-3">Confirm Deletion</h3>
            <p class="fs-5">Are you sure you want to delete <strong>"{{ recipe.title }}"</strong>?</p>
            <p class="text-muted small">This action cannot be undone.</p>
            <form method="POST" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                <a href="{% url 'recipe_detail' recipe.pk %}" class="btn btn-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
